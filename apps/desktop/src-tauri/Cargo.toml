[package]
name = "ember-desktop"
version = "0.2.0"
description = "Ember desktop shell"
authors = ["Ember"]
edition = "2021"

# The `_lib` suffix avoids a name collision between the binary and the library
# on Windows, per Tauri 2 convention.
[lib]
name = "ember_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps right-click → Inspect Element available in RELEASE builds,
# which is the only way to debug a packaged webview app.
tauri = { version = "2", features = ["devtools"] }

# --- Native audio engine (Part 5) ---
# rodio 0.21 keeps the Sink-based API this code targets (connect_new/append/play/
# pause/stop/set_volume/get_pos/try_seek/empty). 0.22 renamed Sink->Player, so do NOT
# bump without a refactor. Default features include `mp4` (= symphonia isomp4 + aac),
# which is what the host's m4a/AAC stream needs.
rodio = "0.21"
# stream-download default features pull in `reqwest` + `temp-storage`, giving a
# seekable, temp-file-backed HTTP reader (Read + Seek) that rodio's Decoder can read.
stream-download = "0.24"
souvlaki = "0.8"                                # OS media controls (wired up in Task 7)
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# --- Transitive dependency unification (not used by our code) ---
# brotli 8.0.3 (pulled in by tauri-codegen/tauri-utils) is internally inconsistent:
# it depends on alloc-no-stdlib 2.0.4 directly, while its siblings alloc-stdlib 0.2.3
# and brotli-decompressor 5.0.2 pull alloc-no-stdlib 3.0.0 — and the two versions are
# trait-incompatible, so the build fails (E0277). Pinning these to the 0.2.2 / 5.0.1
# line (which use alloc-no-stdlib 2.x) makes Cargo unify on a single version.
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"
discord-rich-presence = "1.1.0"
tauri-plugin-updater = "2.10.1"
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
