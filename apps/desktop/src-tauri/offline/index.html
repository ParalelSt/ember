<!doctype html>
<!-- Shown by the desktop shell when the Ember server is out of reach at
     launch (src/connect.rs). The shell keeps trying on its own and loads the
     server as soon as it answers; Retry asks it to try now. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #16161a; color: #e6e6ea;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { text-align: center; padding: 24px; }
  p { margin: 0 0 16px; }
  button {
    font: inherit; color: inherit; cursor: pointer;
    padding: 8px 20px; border-radius: 999px;
    border: 1px solid #3a3a42; background: #25252b;
  }
  button:hover { background: #303038; }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<main>
  <p id="msg">Can't reach Ember, retrying...</p>
  <button id="retry" type="button">Retry</button>
</main>
<script>
(function () {
  var msg = document.getElementById('msg');
  var btn = document.getElementById('retry');
  btn.addEventListener('click', function () {
    msg.textContent = 'Trying again...';
    btn.disabled = true;
    var t = window.__TAURI_INTERNALS__;
    if (t) t.invoke('connect_retry').catch(function () {});
    // Still here after this means the server did not answer.
    setTimeout(function () {
      msg.textContent = "Can't reach Ember, retrying...";
      btn.disabled = false;
    }, 3000);
  });
})();
</script>
</body>
</html>
