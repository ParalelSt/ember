# The webview loads Ember from a REMOTE origin (the server URL). Tauri treats
# remote origins as untrusted by default and denies every command that isn't
# explicitly permitted, including this app's own commands. Without this file
# the shell's IPC is dead: playback, Discord presence and logging all fail with
# "Command <name> not allowed by ACL", which is exactly what a bug report from
# the Windows build showed.
#
# Referenced from capabilities/default.json.
[[permission]]
identifier = "allow-ember-commands"
description = "Ember's own IPC commands: native audio and its output device, the auto cache of upcoming songs, Discord presence, log forwarding, voice search, the window following the theme, the launch gate's update dialog, and links opening in the system browser."

[permission.commands]
allow = [
  "audio_stop",
  "audio_load",
  "audio_play",
  "audio_pause",
  "audio_seek",
  "audio_set_volume",
  # The equalizer (src/eq.rs).
  "audio_set_eq",
  # Repeat one inside the engine (src/repeat.rs).
  "audio_set_loop",
  "audio_set_metadata",
  # Choosing the output device (src/output.rs). Without these the remote
  # page gets "not allowed by ACL" and the output picker stays empty.
  "audio_outputs",
  "audio_set_output",
  # The auto cache of upcoming songs (src/cache.rs). Without these the remote
  # page gets "not allowed by ACL", which the web app reads as an older build
  # and shows "automatic caching unavailable, update the app".
  "cache_prefetch",
  "cache_cancel",
  "cache_has",
  "cache_keys",
  "cache_entries",
  "cache_path",
  "cache_touch",
  "cache_evict",
  "cache_stats",
  "cache_clear",
  "discord_update",
  "log_event",
  "log_path",
  "log_tail",
  # Native voice search (src/speech.rs). Same reason as the rest: without
  # these the remote page's mic gets "not allowed by ACL".
  "speech_available",
  "speech_start",
  "speech_stop",
  "speech_abort",
  # The window background and title bar follow the page's theme
  # (src/theme.rs).
  "theme_apply",
  # The Retry button on the page shown when the server is out of reach
  # (src/connect.rs).
  "connect_retry",
  # The launch gate's dialog on the bundled gate page (src/gate.rs): its
  # state and its buttons. update_gate_events is how the signed-in page
  # picks up the gate's telemetry to send to the server.
  "gate_state",
  "gate_not_now",
  "gate_update_now",
  "gate_quit",
  "update_gate_events",
  # Links out of the app (the tab page's "Find one", any new-tab link) open
  # in the system browser: the webview itself drops them (src/external.rs).
  "open_external",
]
deny = []
