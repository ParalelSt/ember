<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <!--
      Shown by Capacitor (server.errorPath) when the server cannot be reached,
      which on a cold start means no UI at all. Bundled in the APK, it talks
      only to EmberOffline, so it works with the radio off. Colours are the
      theme's variables (ThemeColors.kt) with the pre-theme look as fallback.
    -->
    <style>
      /* Insets: Android 15 draws its bars over this page with env() at 0, so MainActivity publishes them as --ember-inset-*. The title clears the clock, the bar the buttons. */
      :root { --safe-top: max(env(safe-area-inset-top, 0px), var(--ember-inset-top, 0px)); --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--ember-inset-bottom, 0px)); }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--background, #0a0a0a);
        color: var(--foreground, #ededed);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body { padding: 0 0 calc(96px + var(--safe-bottom)); }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding: calc(var(--safe-top) + 20px) 20px 8px;
      }
      .brand { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
      .msg { font-size: 15px; opacity: 0.6; }
      button {
        font: inherit; color: var(--foreground, #ededed); background: var(--surface, #1f1f1f);
        border: 1px solid var(--input, #333); border-radius: 999px; padding: 8px 14px;
      }
      button:active { background: var(--surface-2, #2a2a2a); }
      .center { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .pin { padding: 16px 20px 4px; }
      .pin h2 { font-size: 17px; font-weight: 600; margin: 0; }
      .pin .count { font-size: 13px; opacity: 0.5; margin-top: 2px; }
      .row { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border, #171717); cursor: pointer; }
      .row.on .title { color: var(--ember, #f59e0b); }
      .row .art { width: 40px; height: 40px; border-radius: 6px; background: var(--surface, #1f1f1f); object-fit: cover; flex-shrink: 0; }
      .row .text { min-width: 0; }
      .title { font-size: 15px; }
      .artist { font-size: 13px; opacity: 0.55; margin-top: 2px; }
      .bar {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: none; align-items: center; gap: 12px;
        padding: 12px 16px calc(var(--safe-bottom) + 12px);
        background: var(--sidebar, #141414); border-top: 1px solid var(--border, #262626);
      }
      .bar.on { display: flex; }
      .bar .now { flex: 1; min-width: 0; }
      .bar .now div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="bar" id="bar">
      <div class="now"><div class="title" id="nowTitle"></div><div class="artist" id="nowArtist"></div></div>
      <button id="prev" aria-label="Previous">&#9664;&#9664;</button>
      <button id="toggle" aria-label="Play or pause">&#9658;</button>
      <button id="next" aria-label="Next">&#9654;&#9654;</button>
    </div>
    <audio id="audio"></audio>
    <script>
      var C = window.Capacitor;
      var plugin = C && C.Plugins && C.Plugins.EmberOffline;
      // The native session gives real lock-screen controls; the WebView does
      // not publish one for navigator.mediaSession by itself, so that is only
      // the fallback (and what a plain browser gets).
      var session = C && C.Plugins && C.Plugins.MediaSession;
      var app = document.getElementById('app');
      var bar = document.getElementById('bar');
      var audio = document.getElementById('audio');
      var queue = [];   // the playable tracks of the pin being played
      var index = -1;

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // No plugin, or status() failed: behave like the old fallback page so a
      // transient server hiccup still looks like the app starting up.
      function connecting(attempt) {
        app.innerHTML = '';
        var wrap = el('div', 'center');
        wrap.appendChild(el('div', 'brand', 'Ember'));
        wrap.appendChild(el('div', 'msg', 'Connecting to server…'));
        if (attempt) wrap.appendChild(el('div', 'msg', 'Attempt ' + attempt + ' of ' + DELAYS.length));
        app.appendChild(wrap);
      }

      // Retrying. A failed load lands here, often only for a moment (a radio
      // waking up), so the Offline screen waits for DELAYS.length checks of the
      // server, 1s, 2s, 3s... apart. A check is a no-cors fetch: this page is a
      // local origin, so the answer is opaque, and an opaque response is still
      // proof the server answered. Only a passed check navigates, so a failed
      // navigation cannot reload this page and restart the count forever.
      var DELAYS = [1000, 2000, 3000, 4000, 5000];
      var PROBE_MS = 4000;
      var GUARD_MAX = 3, GUARD_WINDOW = 60000;   // auto-returns allowed per minute
      var busy = false;

      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function serverUrl() {
        return plugin.serverUrl().then(function (r) { return (r && r.url) || null; }, function () { return null; });
      }

      function reachable(url) {
        // An http server cannot be probed from this https origin (mixed
        // content is blocked), so the probe could never pass: go and see.
        if (location.protocol === 'https:' && /^http:/i.test(url)) return Promise.resolve(true);
        var ctl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctl) ctl.abort(); }, PROBE_MS);
        return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl && ctl.signal }).then(
          function () { clearTimeout(timer); return true; },
          function () { clearTimeout(timer); return false; });
      }

      // One round: wait, check, repeat. Resolves the URL once a check passes,
      // else null. onAttempt(n) lets the caller show the progress.
      async function round(onAttempt) {
        for (var n = 1; n <= DELAYS.length; n++) {
          await sleep(DELAYS[n - 1]);
          if (onAttempt) onAttempt(n);
          var url = await serverUrl();
          if (url && await reachable(url)) return url;
        }
        return null;
      }

      // The loop guard: if the server keeps answering the check yet the load
      // still lands back here, stop auto-returning and let the person press
      // Try again. Kept in sessionStorage so it survives this page reloading.
      function mayReturn() {
        try {
          var now = Date.now();
          var log = JSON.parse(sessionStorage.getItem('emberReturns') || '[]').filter(function (t) { return now - t < GUARD_WINDOW; });
          if (log.length >= GUARD_MAX) return false;
          log.push(now);
          sessionStorage.setItem('emberReturns', JSON.stringify(log));
        } catch (e) {}
        return true;
      }

      // Library mode only: never pull someone away from a song they started.
      function go(url) {
        if (index >= 0 || !mayReturn()) return false;
        location.href = url;
        return true;
      }

      // Nothing downloaded: show progress, then the Offline screen if all fail.
      async function retryScreen() {
        if (busy) return;
        busy = true;
        connecting(1);
        var url = await round(connecting);
        busy = false;
        if (url && go(url)) return;
        render([]);
      }

      // Downloads exist: the library is already up; keep trying quietly and
      // return to the server once it answers and nothing is playing.
      async function watch() {
        for (;;) {
          var url = await round();
          if (url && go(url)) return;
          if (url) await sleep(DELAYS[DELAYS.length - 1]);
        }
      }

      function header(again) {
        var h = el('header');
        h.appendChild(el('div', 'brand', 'Offline'));
        var retry = el('button', null, 'Try again');
        retry.onclick = again || function () {
          if (!plugin) return location.reload();
          plugin.serverUrl().then(function (r) {
            location.href = (r && r.url) || location.href;
          }, function () { location.reload(); });
        };
        h.appendChild(retry);
        return h;
      }

      // Artwork is decoration: a failed read just skips the callback.
      function artAsDataUrl(src, cb) {
        fetch(src).then(function (r) { return r.blob(); }).then(function (b) {
          var fr = new FileReader();
          fr.onload = function () { if (typeof fr.result === 'string') cb(fr.result); };
          fr.readAsDataURL(b);
        }).catch(function () {});
      }

      function play(tracks, i) {
        queue = tracks;
        index = i;
        var t = queue[index];
        if (!t) return;
        audio.src = C.convertFileSrc(t.file);
        // A rejected play() (no gesture yet, or a file that will not decode)
        // must not surface as an unhandled rejection: the pause event puts the
        // button back and the error handler below explains a broken file.
        var started = audio.play();
        if (started && started.catch) started.catch(function () {});
        document.getElementById('nowTitle').textContent = t.title || '';
        document.getElementById('nowArtist').textContent = t.artist || '';
        bar.classList.add('on');
        var rows = document.querySelectorAll('.row');
        for (var j = 0; j < rows.length; j++) rows[j].classList.toggle('on', rows[j].dataset.id === t.id);
        var meta = { title: t.title || 'Unknown', artist: t.artist || '', album: t.pinName || 'Offline' };
        // Graceful when a track has no local art: no artwork entry at all
        // rather than a broken image reference.
        if (t.art) meta.artwork = [{ src: t.art, sizes: '512x512' }];
        if (session) {
          session.setMetadata(meta);
          // The native plugin fetches artwork over HTTP, so the _capacitor_file_
          // URL that works in this page leaves the lock screen with no cover.
          var at = index;
          if (t.art) artAsDataUrl(t.art, function (url) {
            meta.artwork = [{ src: url, sizes: '512x512' }];
            if (at === index) session.setMetadata(meta);   // else: skipped on
          });
        } else if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata(meta);
        state('playing');
      }

      function state(s) {
        if (session) session.setPlaybackState({ playbackState: s });
        else if ('mediaSession' in navigator) navigator.mediaSession.playbackState = s;
      }

      function step(delta) {
        if (!queue.length) return;
        var i = index + delta;
        if (i < 0 || i >= queue.length) return;
        play(queue, i);
      }

      function toggle() {
        if (audio.paused) audio.play(); else audio.pause();
      }

      document.getElementById('prev').onclick = function () { step(-1); };
      document.getElementById('next').onclick = function () { step(1); };
      document.getElementById('toggle').onclick = toggle;
      audio.addEventListener('ended', function () { step(1); });
      // There is no stream to fall back to here, so say it plainly: the file is
      // gone or unreadable (deleted outside the app, or a half-written copy).
      audio.addEventListener('error', function () {
        document.getElementById('nowArtist').textContent = 'This download could not be played.';
      });
      audio.addEventListener('play', function () {
        document.getElementById('toggle').textContent = '❚❚';
        state('playing');
      });
      audio.addEventListener('pause', function () {
        document.getElementById('toggle').textContent = '▶';
        state('paused');
      });
      var actions = {
        play: function () { audio.play(); },
        pause: function () { audio.pause(); },
        previoustrack: function () { step(-1); },
        nexttrack: function () { step(1); },
      };
      Object.keys(actions).forEach(function (name) {
        if (session) session.setActionHandler({ action: name }, actions[name]);
        else if ('mediaSession' in navigator) navigator.mediaSession.setActionHandler(name, actions[name]);
      });

      function render(sections) {
        app.innerHTML = '';
        app.appendChild(header(sections.length ? null : retryScreen));
        if (!sections.length) {
          app.appendChild(el('div', 'pin msg', 'Nothing downloaded yet. Connect once and download a playlist for offline use.'));
          return;
        }
        sections.forEach(function (s) {
          var head = el('div', 'pin');
          head.appendChild(el('h2', null, s.name));
          head.appendChild(el('div', 'count', s.tracks.length + (s.tracks.length === 1 ? ' song' : ' songs')));
          app.appendChild(head);
          s.tracks.forEach(function (t, i) {
            var row = el('div', 'row');
            row.dataset.id = t.id;
            // Graceful when a track has no local art: just skip the <img>,
            // no broken-image placeholder.
            if (t.art) {
              var img = document.createElement('img');
              img.className = 'art';
              img.src = t.art;
              img.alt = '';
              row.appendChild(img);
            }
            var text = el('div', 'text');
            text.appendChild(el('div', 'title', t.title || 'Unknown'));
            text.appendChild(el('div', 'artist', t.artist || ''));
            row.appendChild(text);
            row.onclick = function () { play(s.tracks, i); };
            app.appendChild(row);
          });
        });
      }

      async function boot() {
        if (!plugin) return connecting();
        var st;
        try { st = await plugin.status(); } catch (e) { return retryScreen(); }
        var files = (st && st.trackFiles) || {};
        // Absent on older native builds: default to {} so art is just skipped.
        var artFiles = (st && st.artFiles) || {};
        var sections = [];
        var pins = ((st && st.pins) || []).filter(function (p) { return p.done > 0; });
        for (var i = 0; i < pins.length; i++) {
          var pin = pins[i];
          var list = [];
          try { list = (await plugin.tracks({ id: pin.id })).tracks || []; } catch (e) { list = []; }
          // Only tracks whose file is actually on disk: a pin can be part done.
          var playable = list.filter(function (t) { return files[t.id]; }).map(function (t) {
            return {
              id: t.id, title: t.title, artist: t.artist, file: files[t.id],
              art: artFiles[t.id] ? C.convertFileSrc(artFiles[t.id]) : null,
              pinName: pin.name,
            };
          });
          if (playable.length) sections.push({ name: pin.name, tracks: playable });
        }
        if (!sections.length) return retryScreen();
        render(sections);
        watch();
      }

      boot();
    </script>
  </body>
</html>
