apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Discord Rich Presence (DiscordPresence.kt, docs/APPS.md). The Social SDK's
// licence forbids redistributing it, so it stays out of this public repository
// and comes from this machine: EMBER_DISCORD_SDK_DIR (environment or -P), by
// default ~/.ember-tools/discord-sdk. Without it the app builds and runs with
// presence compiled out (src/discordStub): no native code, no NDK.
def discordSdkDir = file(System.getenv('EMBER_DISCORD_SDK_DIR')
    ?: findProperty('EMBER_DISCORD_SDK_DIR')
    ?: "${System.getProperty('user.home')}/.ember-tools/discord-sdk")
def discordAar = new File(discordSdkDir, 'sdk/discord_social_sdk/lib/release/discord_partner_sdk.aar')
def hasDiscordSdk = discordAar.isFile()
// Like the desktop build: the id is baked in at build time; none, no card.
def discordAppId = (System.getenv('DISCORD_APP_ID') ?: findProperty('DISCORD_APP_ID') ?: '').toString().trim()
if (!discordAppId.matches('[0-9]*')) throw new GradleException('DISCORD_APP_ID must be digits')
// A test build's trace of the card's every step, through the player log as
// "discord.diag" (DiscordDiagnostics.kt). Off unless asked for.
def discordDiag = (System.getenv('EMBER_DISCORD_DIAG') ?: findProperty('EMBER_DISCORD_DIAG') ?: '').toString().trim() == '1'
// A test build against a server whose page predates the switch's plugin
// (lib/androidDiscord.ts): the card is on until a page says otherwise.
def discordDefaultOn = (System.getenv('EMBER_DISCORD_DEFAULT_ON') ?: findProperty('EMBER_DISCORD_DEFAULT_ON') ?: '').toString().trim() == '1'
logger.lifecycle("Discord presence: ${hasDiscordSdk ? 'SDK' : 'no SDK, compiled out'}, ${discordAppId ? 'app id set' : 'no app id'}${discordDiag ? ', diagnostics on' : ''}${discordDefaultOn ? ', on by default' : ''}")

android {
    namespace "app.ember.music"
    buildFeatures { buildConfig true }
    // Exactly one of these two holds DiscordSdkBridge.
    sourceSets.main.java.srcDirs += hasDiscordSdk ? 'src/discordSdk/java' : 'src/discordStub/java'
    if (hasDiscordSdk) {
        // The version the SDK's prefab was built with (and AGP 8.7's default).
        ndkVersion '27.0.12077973'
        buildFeatures { prefab true }
        externalNativeBuild {
            cmake {
                path 'src/discordSdk/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
    // Capacitor compiles Java at 21 (capacitor.build.gradle); Kotlin must match.
    kotlinOptions { jvmTarget = '21' }
    // Robolectric: real Bundle/Uri/org.json in JVM tests instead of stubs, and
    // Media3 builders touch android.* classes in plain JVM unit tests too.
    testOptions {
        unitTests.includeAndroidResources = true
        // The auto cache policy's shared case table lives with the web port
        // (apps/web/lib/autoCache/policy.cases.json). AutoCachePolicyTest reads
        // it from there, never from a copy, so the two ports test against one
        // file; declaring it an input reruns the tests when it changes.
        unitTests.all { test ->
            def cases = file('../../../web/lib/autoCache/policy.cases.json')
            test.inputs.file(cases)
            test.systemProperty 'ember.autoCacheCases', cases.absolutePath
        }
    }
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.ember.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 41
        versionName "0.4.36"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'DISCORD_APP_ID', "\"${discordAppId}\""
        buildConfigField 'boolean', 'DISCORD_DIAG', discordDiag ? 'true' : 'false'
        buildConfigField 'boolean', 'DISCORD_DEFAULT_ON', discordDefaultOn ? 'true' : 'false'
        if (hasDiscordSdk) {
            externalNativeBuild {
                cmake { arguments '-DANDROID_STL=c++_static' }
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing (Part 6). Reads android/keystore.properties when present
    // (local keystore or CI-decoded secret); ABSENT → release falls back to the
    // debug key so anyone can still build. Keystore + properties are gitignored.
    // Debug builds take the release key too when it is there: a debug-key
    // app.ember.music (npm run apk, cap run, Android Studio's Run) on a phone
    // refuses every release over it, and only an uninstall gets updates back.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // WebViewCompat.addDocumentStartJavaScript, to give the bundled offline
    // page the Capacitor runtime (see MainActivity). Capacitor pulls webkit in
    // itself, but only as `implementation`, so it is not on our classpath.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Offline downloads (see OfflineStore.kt / ServerApi.kt).
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    implementation project(':capacitor-cordova-android-plugins')
    // Native player + Android Auto (see EmberPlaybackService.kt).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    // Auto cache (AutoCacher.kt): SimpleCache, CacheWriter and its index database.
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-database:$media3Version"
    // Casting (CastSupport.kt): CastPlayer and, through it, the Google Cast
    // framework and androidx.mediarouter for the device picker.
    implementation "androidx.media3:media3-cast:$media3Version"
    // The phone's output picker (EmberPlayerPlugin.showOutputSwitcher):
    // SystemOutputSwitcherDialogController, which opens Android's own output
    // switcher on each Android version that has one, and the
    // MediaTransferReceiver that lists cast devices in it. media3-cast only
    // brings in mediarouter 1.3.0, which has neither.
    implementation "androidx.mediarouter:mediarouter:$mediarouterVersion"
    // "Scan QR code" (QrScan.kt): Google's code scanner, its own camera
    // screen from Play services, no camera permission.
    implementation "com.google.android.gms:play-services-code-scanner:$codeScannerVersion"
    if (hasDiscordSdk) implementation files(discordAar)
}

apply from: 'capacitor.build.gradle'
apply from: 'network-security.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
