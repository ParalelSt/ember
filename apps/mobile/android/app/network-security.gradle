// Network security config, generated from the server this build points at
// (security audit 2026-09-25, M5).
//
// Cleartext HTTP is off for every host, except the Ember server itself when
// its URL is http:// (a self-hosted server on a LAN or Tailscale IP, or the
// emulator's 10.0.2.2). An https server (Tailscale Funnel) gets no cleartext
// at all. The URL comes from assets/capacitor.config.json, which `npx cap
// sync` writes from EMBER_APP_URL (see capacitor.config.ts), the same file
// ServerConfig.kt reads at runtime, with the same fallback when it is absent.
// The WebView and OkHttp (API calls, ExoPlayer, downloads) both honour it.

import groovy.json.JsonSlurper

def emberServerUrl = {
    def config = file('src/main/assets/capacitor.config.json')
    def url = config.exists() ? new JsonSlurper().parse(config)?.server?.url : null
    return url ? url.toString().trim() : 'http://localhost:3000'
}

/** The host cleartext is allowed to, or null for an https (or odd) URL. */
def cleartextHost = { String url ->
    def uri
    try { uri = new URI(url) } catch (URISyntaxException ignored) { return null }
    if (uri.scheme?.toLowerCase() != 'http' || !uri.host) return null
    // An IPv6 literal comes back in brackets; the config wants it bare.
    return uri.host.replaceAll(/^\[|\]$/, '')
}

def nscOut = layout.buildDirectory.dir('generated/ember-network-security/res')

def generateNetworkSecurityConfig = tasks.register('generateNetworkSecurityConfig') {
    def configFile = file('src/main/assets/capacitor.config.json')
    inputs.property('serverUrl', providers.provider { emberServerUrl() })
    outputs.dir(nscOut)
    doLast {
        def host = cleartextHost(emberServerUrl())
        def out = nscOut.get().file('xml/network_security_config.xml').asFile
        out.parentFile.mkdirs()
        def escaped = host == null ? null : host.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
        def domain = escaped == null ? '' : """
    <!-- The Ember server is plain http: cleartext to it, and only to it. -->
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">${escaped}</domain>
    </domain-config>"""
        out.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by app/network-security.gradle from the server URL. Do not edit. -->
<network-security-config>
    <base-config cleartextTrafficPermitted="false" />${domain}
</network-security-config>
"""
    }
}

android.applicationVariants.all { variant ->
    variant.registerGeneratedResFolders(project.files(nscOut).builtBy(generateNetworkSecurityConfig))
}
