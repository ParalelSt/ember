# Pings the friend who hosts in Discord (#release-notif) when main has changes
# he needs to update for. Changes pushed before 19:00 Europe/Zagreb are sent at
# 19:00; changes pushed after 19:00 are sent as soon as they are pushed. No
# changes, no ping.
#
# GitHub starts scheduled runs late (hours, at busy times), so the afternoon
# runs start well before 19:00: one that finds waiting changes sleeps until
# 19:00, fetches main again and pings then. Only one run holds the
# concurrency group, so the others queue behind it and find nothing new. The
# evening runs are a fallback if the afternoon ones never started.
# State lives in the annotated tag notified/main (message = date it was sent).
#
# Config (Settings -> Secrets and variables -> Actions):
#   * Secret    DISCORD_RELEASE_WEBHOOK  webhook of the #release-notif channel
#   * Variable  DISCORD_NOTIFY_USER_ID   Discord user id of the host
# Without both, the run logs and exits without moving the tag.

name: release-ping

on:
  push:
    branches: [main]
  schedule:
    # afternoon (UTC): sleep until 19:00 local, summer and winter time
    - cron: "23,53 12-16 * * *"
    # evening fallback: pings at once if something is still waiting
    - cron: "7,37 17-21 * * *"
  workflow_dispatch:

concurrency:
  group: release-ping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    # a run may sleep up to 5.5 hours until 19:00 (MAX_WAIT_MS)
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The state tag is annotated, which needs a committer name.
      - name: Git identity for the state tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ping if there is a new version
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_NOTIFY_USER_ID: ${{ vars.DISCORD_NOTIFY_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-ping.mjs
