# WS3 — Native app build CI for Ember.
#
# Builds the native shells that wrap the live Ember web server:
#   • apps/desktop  — Tauri 2 desktop app (macOS / Linux / Windows)
#   • apps/mobile   — Capacitor 6 Android app (debug APK)
#   • iOS           — deferred (disabled stub, see bottom of file)
#
# apps/web is NOT built here; it is deployed separately. The native shells load a
# REMOTE server URL (server.url / set-url.mjs model), so no web `dist` is bundled.
#
# Triggers:
#   • push of a tag matching v*  → builds AND attaches installers to a GitHub Release
#   • workflow_dispatch          → builds + uploads workflow artifacts only (no Release)
#
# Required GitHub config (Settings → Secrets and variables → Actions):
#   • Variable  EMBER_APP_URL  — the public URL the native apps should load
#                                (e.g. https://ember.example.ts.net). Falls back to
#                                http://localhost:3000 if unset, which is only useful
#                                for smoke-testing the build, not a shippable app.
#   • GITHUB_TOKEN             — provided automatically by Actions; used to create the
#                                Release and upload assets. No manual setup needed.

name: native-build

on:
  push:
    tags:
      - "v*"
    # Build on pushes to this branch too, so the installers can be produced and
    # downloaded without cutting a release tag. `workflow_dispatch` only works
    # once the workflow file is on the DEFAULT branch, which it isn't yet —
    # remove this once the fix reaches main.
    branches:
      - feat/windows-desktop
  workflow_dispatch:

# Allow the Tauri job to create a Release and upload assets via GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Desktop (Tauri 2) — matrix across the three desktop OSes.
  #    Uses the official tauri-apps/tauri-action, pinned to its current major (v0;
  #    latest release is v0.6.x — there is no published v1 despite some doc samples).
  #    The action runs `tauri build`, finds the produced bundles, and (when tagName
  #    is set) creates/updates a GitHub Release and uploads them as assets.
  # ---------------------------------------------------------------------------
  desktop:
    strategy:
      fail-fast: false
      # Release tags build all three desktop OSes:
      #   macos-latest   → .dmg / .app     ubuntu-latest → .AppImage / .deb
      #   windows-latest → .msi / .exe (NSIS)
      # Branch pushes build Windows ONLY. This repo is private, so runner
      # minutes are billed and macOS bills at 10x — no reason to pay for a Mac
      # build on every branch push when it can be built locally on the Mac.
      matrix:
        platform: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/tags/')
              && '["macos-latest","ubuntu-latest","windows-latest"]'
              || '["windows-latest"]') }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux needs WebKitGTK + GTK system libs for Tauri 2 (webkit2gtk-4.1).
      # Package list per the current Tauri v2 Debian/Ubuntu prerequisites docs.
      - name: Install Linux system dependencies (Tauri)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stable Rust toolchain for the Tauri (Rust) backend.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build to speed up subsequent runs (keyed on the OS + Cargo.lock).
      - name: Cache Rust (cargo + target)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Install JS deps at the workspace ROOT (npm ci fails inside a workspace
      # member). Hoisted deps (incl. @tauri-apps/cli) land in root node_modules.
      - name: Install dependencies (workspace root)
        run: npm ci

      # Inject the remote server URL into tauri.conf.json BEFORE the action builds.
      # tauri-action appends `build` to tauriScript, so we can't reuse `npm run build`
      # (which would also run `tauri build`); instead we run the prepare step on its own
      # here and let the action invoke the CLI for the actual build.
      - name: Inject EMBER_APP_URL into tauri.conf.json
        working-directory: apps/desktop
        env:
          EMBER_APP_URL: ${{ vars.EMBER_APP_URL || 'http://localhost:3000' }}
        run: npm run prepare:url

      # macOS signing + notarization. All optional: when the secrets are absent
      # the build still succeeds, just unsigned (Gatekeeper will warn).
      #   APPLE_CERTIFICATE          base64 of the exported .p12
      #   APPLE_CERTIFICATE_PASSWORD its export password
      #   APPLE_SIGNING_IDENTITY     "Developer ID Application: NAME (TEAMID)"
      #   APPLE_ID / APPLE_PASSWORD  Apple ID + app-specific password
      #   APPLE_TEAM_ID              e.g. 8B8D2GSC9U
      - name: Build Tauri app & upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Tauri project root (where tauri.conf.json lives).
          projectPath: apps/desktop
          # Use the local @tauri-apps/cli via the `tauri` npm script; the action
          # appends `build`, so this resolves to `npm run tauri -- build`.
          tauriScript: npm run tauri --
          # On a tag push, create/attach to a Release; otherwise leave empty so the
          # action only builds (artifacts are uploaded via uploadWorkflowArtifacts).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Ember {0}', github.ref_name) || '' }}
          releaseBody: "Ember desktop builds for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          # NOTE: no `uploadWorkflowArtifacts` here — tauri-action@v0 has no such
          # input and warns "Unexpected input(s)" while silently doing nothing.
          # The explicit upload step below is what keeps the installers.

      # tauri-action's own uploadWorkflowArtifacts only fires when there's a
      # release to attach to — on a branch push it logs "No releaseId or
      # tagName provided, skipping all uploads" and the installers it just
      # built are discarded with the runner. Upload them explicitly so a
      # non-tag build still hands you something installable.
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ember-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # A binary that compiles is not a binary that works. GitHub's Windows
      # runners have a desktop session and a preinstalled WebView2 runtime, so
      # the real app can be launched here and inspected — which is the only
      # Windows machine this project has.
      #
      # Asserts: the process survives startup (no instant crash), it writes its
      # log (which needs LOCALAPPDATA — $HOME doesn't exist on Windows), the
      # webview reaches the live server, and SMTC media controls initialise.
      - name: Smoke-test the Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Cargo names the binary after the crate (ember-desktop.exe); only the
          # INSTALLED app is called Ember.exe. Accept either.
          $exe = Get-ChildItem -Path apps/desktop/src-tauri/target/release -Filter '*.exe' |
                 Where-Object { $_.Name -in @('ember-desktop.exe', 'Ember.exe') } |
                 Select-Object -First 1
          if (-not $exe) { throw "no Ember binary in target/release" }
          Write-Host "launching $($exe.FullName)"

          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30

          $log = Join-Path $env:LOCALAPPDATA 'Ember\logs\ember-desktop.log'
          $alive = -not $proc.HasExited
          if (-not $alive) { Write-Host "::error::app exited on its own (code $($proc.ExitCode))" }

          if (Test-Path $log) {
            Write-Host "----- ember-desktop.log -----"
            Get-Content $log | Select-Object -First 60
            Write-Host "-----------------------------"
          } else {
            Write-Host "::error::no log at $log — logging is broken on Windows"
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          $failures = @()
          if (-not $alive) { $failures += "process died during startup" }
          if (-not (Test-Path $log)) { $failures += "no log file written" }
          else {
            $text = Get-Content $log -Raw
            if ($text -notmatch 'ember-desktop starting') { $failures += "app never logged startup" }
            # Wired in this branch; a regression here means no media keys and no
            # Now Playing flyout on Windows.
            if ($text -match 'media controls unavailable') { $failures += "SMTC failed to initialise" }
            if ($text -notmatch 'media controls ready')    { $failures += "media controls never reported ready" }
          }

          if ($failures.Count -gt 0) {
            throw "Windows smoke test failed: $($failures -join '; ')"
          }
          Write-Host "OK — app launched, logged, and initialised media controls"

  # ---------------------------------------------------------------------------
  # 2. Android (Capacitor 7) — RELEASE APK. Signed with the Ember release key
  #    when the secrets below exist; falls back to a debug-signed release APK
  #    otherwise (still installable, but uninstall/reinstall needed when the
  #    signature changes later — set the secrets before sharing widely).
  #
  #    Optional secrets (Settings → Secrets → Actions):
  #      • ANDROID_KEYSTORE_B64       — base64 of ember-release.keystore
  #                                     (make with: base64 -i ember-release.keystore)
  #      • ANDROID_KEYSTORE_PASSWORD  — the store/key password
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install at the workspace ROOT (npm ci fails inside a workspace member);
      # the @capacitor/cli semver override is applied here too.
      - name: Install dependencies (workspace root)
        run: npm ci

      # Sync the Capacitor config + plugins into the native Android project.
      # No web assets are copied for the server.url model, but cap sync is still
      # needed to apply config (appId, server settings) and install plugins.
      - name: Capacitor sync (android)
        working-directory: apps/mobile
        env:
          # Bakes the target server URL into the synced Android config
          # (capacitor.config.ts reads process.env.EMBER_APP_URL).
          EMBER_APP_URL: ${{ vars.EMBER_APP_URL || 'http://localhost:3000' }}
        # Invoke the CLI by its real path (not the .bin/cap shim) so resolution
        # is immune to npm's workspace symlink-vs-copy quirk.
        run: node ../../node_modules/@capacitor/cli/bin/capacitor sync android

      # Materialize the release keystore from secrets (skipped when unset —
      # build.gradle then falls back to debug signing automatically).
      # NOTE: `secrets` is NOT available in a step-level `if:` — using it there
      # makes the whole workflow file invalid, and GitHub then fails every run
      # in 0s with "workflow file issue" (which is exactly what happened here:
      # no native build ever ran). Mirror the secret into `env` and branch on
      # that instead; `env` IS allowed in `if:`.
      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ember-release.keystore
          {
            echo "storeFile=ember-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=ember"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On tag builds, also attach the APK to the (draft) release the desktop
      # job creates, so all installers live in one place. gh handles draft
      # releases by tag; retry a few times in case the desktop job hasn't
      # created it yet. continue-on-error: the artifact upload above is the
      # safety net either way.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "ember-${{ github.ref_name }}.apk"
          for i in 1 2 3 4 5; do
            gh release upload "${{ github.ref_name }}" "ember-${{ github.ref_name }}.apk" --clobber && exit 0
            echo "release not ready yet (attempt $i), retrying in 60s…"; sleep 60
          done
          echo "could not attach APK — grab it from the workflow artifact instead"

  # ---------------------------------------------------------------------------
  # 3. iOS (Capacitor) — DEFERRED. Intentionally disabled.
  #
  #    Building/signing an iOS app requires all of the following, none of which
  #    are set up yet:
  #      • a macos-latest runner with Xcode,
  #      • an Apple Developer Program account,
  #      • a signing certificate (.p12) + provisioning profile imported into the
  #        runner keychain (typically via apple-actions/import-codesign-certs),
  #      • the iOS Capacitor platform added to apps/mobile (`npx cap add ios`),
  #        which does not currently exist in the repo.
  #
  #    When ready, enable by setting `if: true` and filling in the signing steps.
  # ---------------------------------------------------------------------------
  # Gated on a repo variable rather than a constant `if: false`, which
  # actionlint flags. Set BUILD_IOS=true once Apple signing is configured.
  ios:
    if: vars.BUILD_IOS == 'true'
    runs-on: macos-latest
    steps:
      - name: Placeholder
        run: echo "iOS build is deferred; see workflow comments."
